<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UGV FleetTrack — Mobile Live GPS Tracking</title>
    
    <!-- Google Fonts: Outfit & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Leaflet Map CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- FleetTrack Dashboard Styles -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="light-theme">
    <div class="fleet-app">
        <!-- Floating Top Header Bar -->
        <header class="fleet-header">
            <div class="header-left">
                <div class="vehicle-icon">
                    <i class="fa-solid fa-truck-monster"></i>
                </div>
                <div class="vehicle-meta">
                    <h2>UGV-TRACKER-01</h2>
                    <span class="motion-status parked" id="motionStatusBadge">PARKED</span>
                </div>
            </div>
            
            <div class="header-right">
                <div class="mini-chip battery-chip" id="batteryChip">
                    <i class="fa-solid fa-battery-full"></i> <span id="batteryVal">4.2V</span>
                </div>
                <div class="mini-chip signal-chip" id="signalChip">
                    <i class="fa-solid fa-signal"></i> <span id="rssiVal">-- CSQ</span>
                </div>
            </div>
        </header>

        <!-- Fullscreen Main Map -->
        <main class="fleet-map-container">
            <div id="map"></div>

            <!-- Floating Map Selector Top Overlay -->
            <div class="map-selector-overlay">
                <i class="fa-solid fa-layer-group"></i>
                <select id="mapTypeSelect">
                    <option value="google_roadmap">Google Maps (Roadmap)</option>
                    <option value="google_hybrid">Google Maps (Satellite Hybrid)</option>
                    <option value="osm">OpenStreetMap</option>
                </select>
            </div>
        </main>

        <!-- FleetTrack Bottom Sheet -->
        <section class="fleet-bottom-sheet">
            <div class="sheet-drag-handle"></div>

            <!-- Primary Speed & Distance Banner -->
            <div class="speed-distance-row">
                <div class="speed-box">
                    <span class="speed-num" id="speedVal">0.0</span>
                    <span class="speed-unit">km/h</span>
                </div>
                <div class="distance-box">
                    <span class="dist-label">TRIP DISTANCE</span>
                    <span class="dist-num" id="distanceVal">0.0 <small>m</small></span>
                </div>
            </div>

            <!-- Fix Quality & Satellite Bar -->
            <div class="status-strip">
                <div class="strip-item">
                    <i class="fa-solid fa-satellite"></i>
                    <div>
                        <small>SATELLITES</small>
                        <strong id="satellitesVal">--</strong>
                    </div>
                </div>
                <div class="strip-item">
                    <i class="fa-solid fa-shield-halved"></i>
                    <div>
                        <small>GPS PRECISION</small>
                        <strong id="fixModeBadge">Checking Fix...</strong>
                    </div>
                </div>
            </div>

            <!-- Coordinates & Location Info -->
            <div class="location-card">
                <div class="loc-item">
                    <span class="lbl">Latitude:</span>
                    <span class="val" id="latVal">0.000000°</span>
                </div>
                <div class="loc-item">
                    <span class="lbl">Longitude:</span>
                    <span class="val" id="lonVal">0.000000°</span>
                </div>
                <div class="loc-item">
                    <span class="lbl">Altitude:</span>
                    <span class="val" id="altVal">0.0 m</span>
                </div>
            </div>

            <!-- Action Buttons Grid -->
            <div class="sheet-actions">
                <button class="btn btn-primary" id="btnCenterMap">
                    <i class="fa-solid fa-bullseye"></i> Center Vehicle
                </button>
                <button class="btn btn-secondary" id="btnClearTrail">
                    <i class="fa-solid fa-trash-can"></i> Clear Route
                </button>
            </div>

            <div class="sheet-actions">
                <button class="btn btn-secondary" id="btnViewHistoryMap">
                    <i class="fa-solid fa-map-location-dot"></i> View History Map
                </button>
                <button class="btn btn-secondary" id="btnDownloadCSV">
                    <i class="fa-solid fa-file-csv"></i> Export CSV Logs
                </button>
            </div>
        </section>

        <!-- Separate Dedicated History Route Map Modal -->
        <div class="modal-overlay" id="historyModal">
            <div class="modal-container">
                <div class="modal-header">
                    <div class="modal-title">
                        <i class="fa-solid fa-route"></i>
                        <h3>UGV-TRACKER-01 — Dedicated History Route Map</h3>
                    </div>
                    <button class="modal-close-btn" id="btnCloseHistoryModal">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                
                <div class="modal-stats-bar">
                    <div class="mstat"><small>TOTAL LOGGED POINTS</small><strong id="hPointsVal">0</strong></div>
                    <div class="mstat"><small>MAX SPEED</small><strong id="hMaxSpeedVal">0.0 km/h</strong></div>
                    <div class="mstat"><small>HISTORICAL DISTANCE</small><strong id="hDistanceVal">0.0 m</strong></div>
                </div>

                <div class="modal-map-wrapper">
                    <div id="historyMap"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <!-- App Logic -->
    <script src="/static/app.js"></script>
</body>
</html>
