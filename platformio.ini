[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
monitor_port = /dev/ttyUSB0
upload_port = /dev/ttyUSB0
monitor_rts = 0
monitor_dtr = 0
monitor_filters = direct, esp32_exception_decoder
build_flags = 
    -D CORE_DEBUG_LEVEL=3
lib_deps = 
    bblanchon/ArduinoJson @ ^6.21.5
